<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Automático Live TikTok</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(22, 27, 34, 0.85);
      --pink-neon: #ff0050;
      --cyan-neon: #00f2fe;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    .header-title {
      font-size: 1.4rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(90deg, var(--pink-neon), var(--cyan-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.5));
    }

    .main-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-box {
      background: rgba(15, 15, 25, 0.6);
      border-radius: 16px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .curtidas-title { color: var(--cyan-neon); }
    .presentes-title { color: var(--pink-neon); }

    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rank-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
      animation: flutuar 3s ease-in-out infinite alternate;
    }

    @keyframes flutuar {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }

    .top-1 { border-color: var(--gold); box-shadow: 0 0 12px rgba(255, 215, 0, 0.3); }
    .top-2 { border-color: var(--silver); box-shadow: 0 0 10px rgba(192, 192, 192, 0.2); }
    .top-3 { border-color: var(--bronze); box-shadow: 0 0 8px rgba(205, 127, 50, 0.2); }

    .badge {
      font-size: 1.2rem;
      font-weight: bold;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }

    .top-1 .badge { background: rgba(255, 215, 0, 0.2); color: var(--gold); }
    .top-2 .badge { background: rgba(192, 192, 192, 0.2); color: var(--silver); }
    .top-3 .badge { background: rgba(205, 127, 50, 0.2); color: var(--bronze); }

    .user-info {
      flex-grow: 1;
      margin-left: 12px;
    }

    .username {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      display: block;
    }

    .subtext {
      font-size: 0.75rem;
      color: #8a8d93;
    }

    .score {
      font-size: 0.95rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
    }

    .score-curtidas { color: var(--cyan-neon); border: 1px solid rgba(0, 242, 254, 0.3); }
    .score-presentes { color: var(--pink-neon); border: 1px solid rgba(255, 0, 80, 0.3); }
  </style>
</head>
<body>

  <div class="header-title">🔥 Destaques da Live 🔥</div>

  <div class="main-container">

    <!-- SECÇÃO TOP CURTIDAS (ZERADO) -->
    <div class="section-box">
      <div class="section-title curtidas-title">
        <span>⚡</span> Top Curtidas
      </div>
      <div class="ranking-list">
        
        <div class="rank-card top-1">
          <div class="badge">🥇</div>
          <div class="user-info">
            <span class="username" id="like-name-1">Aguardando...</span>
            <span class="subtext">Maior Tapper</span>
          </div>
          <div class="score score-curtidas" id="like-score-1">❤️ 0</div>
        </div>

        <div class="rank-card top-2">
          <div class="badge">🥈</div>
          <div class="user-info">
            <span class="username" id="like-name-2">Aguardando...</span>
            <span class="subtext">Super Apoiador</span>
          </div>
          <div class="score score-curtidas" id="like-score-2">❤️ 0</div>
        </div>

        <div class="rank-card top-3">
          <div class="badge">🥉</div>
          <div class="user-info">
            <span class="username" id="like-name-3">Aguardando...</span>
            <span class="subtext">Apoiador Frequente</span>
          </div>
          <div class="score score-curtidas" id="like-score-3">❤️ 0</div>
        </div>

      </div>
    </div>

    <!-- SECÇÃO TOP PRESENTEADORES (ZERADO) -->
    <div class="section-box">
      <div class="section-title presentes-title">
        <span>🎁</span> Top Presenteadores
      </div>
      <div class="ranking-list">
        
        <div class="rank-card top-1">
          <div class="badge">👑</div>
          <div class="user-info">
            <span class="username" id="gift-name-1">Aguardando...</span>
            <span class="subtext">Rei da Live</span>
          </div>
          <div class="score score-presentes" id="gift-score-1">💎 0</div>
        </div>

        <div class="rank-card top-2">
          <div class="badge">💎</div>
          <div class="user-info">
            <span class="username" id="gift-name-2">Aguardando...</span>
            <span class="subtext">Super Doador</span>
          </div>
          <div class="score score-presentes" id="gift-score-2">💎 0</div>
        </div>

        <div class="rank-card top-3">
          <div class="badge">⭐</div>
          <div class="user-info">
            <span class="username" id="gift-name-3">Aguardando...</span>
            <span class="subtext">Doador VIP</span>
          </div>
          <div class="score score-presentes" id="gift-score-3">💎 0</div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
